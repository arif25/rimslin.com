<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <!-- Brand Gradient: emerald-600 -> emerald-400 -> amber-400 -->
    <linearGradient id="brandBorderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Subtle Icon Drop Shadow -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.25" />
    </filter>

    <style>
      .brand-title {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 35px;
        font-weight: 900;
        letter-spacing: -0.03em;
        fill: #0f172a;
      }
      .brand-domain {
        fill: #f59e0b;
      }
      .brand-sub {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
        fill: #64748b;
      }
      .badge-container {
        fill: #ecfdf5;
        stroke: #a7f3d0;
        stroke-width: 1.2px;
      }
      .badge-label {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.01em;
        fill: #047857;
      }
      .icon-box {
        fill: #07120b;
      }

      /* Dark mode adaptive styles */
      @media (prefers-color-scheme: dark) {
        .brand-title {
          fill: #ffffff;
        }
        .brand-domain {
          fill: #fbbf24;
        }
        .brand-sub {
          fill: #94a3b8;
        }
        .badge-container {
          fill: rgba(6, 78, 59, 0.45);
          stroke: #065f46;
        }
        .badge-label {
          fill: #34d399;
        }
      }
    </style>
  </defs>

  <!-- Group 1: Brand Icon (x=20, y=24, 72x72) -->
  <g transform="translate(20, 24)" filter="url(#iconGlow)">
    <!-- Gradient Border (1px border effect) -->
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#brandBorderGrad)" />
    <!-- Inner Dark / Slate Container -->
    <rect x="2" y="2" width="68" height="68" rx="16" class="icon-box" />

    <!-- Lucide Globe Icon (Centered, 38x38 inside 68x68) -->
    <g transform="translate(17, 17) scale(1.58)" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
      <path d="M2 12h20" />
    </g>
  </g>

  <!-- Group 2: Brand Typography & Badges -->
  <g transform="translate(110, 0)">
    <!-- Title: Rimslin.com -->
    <text x="0" y="65" class="brand-title">
      Rimslin<tspan class="brand-domain">.com</tspan>
    </text>

    <!-- StepAhead Badge: inline pill right after Rimslin.com -->
    <g transform="translate(222, 45)">
      <rect x="0" y="0" width="74" height="23" rx="6" class="badge-container" />
      <text x="37" y="16" text-anchor="middle" class="badge-label">StepAhead</text>
    </g>

    <!-- Subtitle: Expat Language & Career Platform -->
    <text x="1" y="87" class="brand-sub">
      Expat Language &amp; Career Platform
    </text>
  </g>
</svg>
