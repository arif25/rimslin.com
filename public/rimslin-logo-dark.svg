<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <linearGradient id="brandBorderGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <filter id="iconGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Group 1: Brand Icon -->
  <g transform="translate(20, 24)" filter="url(#iconGlowDark)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#brandBorderGradDark)" />
    <rect x="2" y="2" width="68" height="68" rx="16" fill="#07120b" />

    <g transform="translate(17, 17) scale(1.58)" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
      <path d="M2 12h20" />
    </g>
  </g>

  <!-- Group 2: Brand Typography & Badges -->
  <g transform="translate(110, 0)">
    <text x="0" y="65" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="35" font-weight="900" letter-spacing="-0.03em" fill="#ffffff">
      Rimslin<tspan fill="#f59e0b">.com</tspan>
    </text>

    <!-- StepAhead Badge -->
    <g transform="translate(222, 45)">
      <rect x="0" y="0" width="74" height="23" rx="6" fill="#064e3b" fill-opacity="0.45" stroke="#065f46" stroke-width="1.2" />
      <text x="37" y="16" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">StepAhead</text>
    </g>

    <!-- Subtitle -->
    <text x="1" y="87" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.02em" fill="#94a3b8">
      Expat Language &amp; Career Platform
    </text>
  </g>
</svg>
